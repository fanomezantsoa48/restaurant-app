<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respantrie - Restaurant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 1.8em; }
        .header .time { font-size: 1.2em; margin-top: 5px; opacity: 0.9; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .btn-refresh { display: block; margin: 0 auto 20px; padding: 12px 30px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 1em; cursor: pointer; font-weight: bold; }
        .btn-refresh:hover { background: #2980b9; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .stat-card .number { font-size: 3em; font-weight: bold; }
        .stat-card .label { color: #666; margin-top: 5px; }
        .stat-active .number { color: #e74c3c; }
        .stat-preparing .number { color: #f39c12; }
        .stat-ready .number { color: #27ae60; }
        .order-card { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); border-left: 5px solid #3498db; }
        .order-pending { border-left-color: #f39c12; }
        .order-preparing { border-left-color: #3498db; }
        .order-ready { border-left-color: #27ae60; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge { padding: 8px 20px; border-radius: 30px; color: white; font-weight: bold; font-size: 0.9em; }
        .badge-pending { background: #f39c12; }
        .badge-preparing { background: #3498db; }
        .badge-ready { background: #27ae60; }
        .order-items { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .item-tag { background: #ecf0f1; padding: 8px 15px; border-radius: 20px; font-size: 0.9em; }
        .btn { padding: 12px 25px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-right: 10px; margin-top: 10px; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        .btn-start { background: #3498db; }
        .btn-ready { background: #27ae60; }
        .btn-served { background: #95a5a6; }
        .no-orders { text-align: center; padding: 60px; color: #999; font-size: 1.2em; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2c3e50; text-decoration: none; font-weight: bold; }
        .loading { text-align: center; padding: 40px; color: #999; }
        .error-message { text-align: center; padding: 40px; color: #e74c3c; background: #ffeaea; border-radius: 15px; margin: 20px; }
        @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍🍳 Administration Respantrie</h1>
        <div class="time" id="currentTime"></div>
    </div>
    
    <div class="container">
        <a href="index.html" class="back-link">← Retour</a>
        
        <button class="btn-refresh" onclick="loadOrders()">🔄 Actualiser les commandes</button>
        
        <div class="stats">
            <div class="stat-card stat-active">
                <div class="number" id="activeCount">0</div>
                <div class="label">Commandes actives</div>
            </div>
            <div class="stat-card stat-preparing">
                <div class="number" id="preparingCount">0</div>
                <div class="label">En préparation</div>
            </div>
            <div class="stat-card stat-ready">
                <div class="number" id="readyCount">0</div>
                <div class="label">Prêts à servir</div>
            </div>
        </div>
        
        <div id="ordersContainer">
            <p class="loading">⏳ Chargement des commandes...</p>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANT: Remplacez cette URL par votre URL de déploiement Web App
        // Allez dans Google Apps Script → Déployer → Nouveau déploiement → Application Web
        // Copiez l'URL et collez-la ici
        const API_URL = 'https://script.google.com/macros/s/AKfycbxiz0eeCxxJvUQWkXyBX8nhgrD3ArQ6Ux3e2qF_h7m5OSAXu6E6heDEIgJc0Kn8dACq/exec';
        
        let orders = [];
        
        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '<p class="loading">⏳ Chargement des commandes...</p>';
            
            try {
                // Utiliser fetch moderne au lieu de JSONP
                const response = await fetch(API_URL + '?action=getOrders&_=' + Date.now(), {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Données reçues:', data);
                
                if (data.orders && Array.isArray(data.orders) && data.orders.length > 0) {
                    orders = data.orders.map(order => ({
                        id: order.orderNumber,
                        customer: order.customerName,
                        items: order.items.map(i => i.name || i),
                        total: order.total || 0,
                        status: order.status || 'pending'
                    }));
                } else {
                    orders = [];
                }
                displayOrders();
                
            } catch(error) {
                console.error('Erreur détaillée:', error);
                container.innerHTML = `
                    <div class="error-message">
                        ❌ Erreur de connexion<br>
                        <small>${error.message}</small><br><br>
                        <strong>Vérifiez que :</strong><br>
                        1. Le script Google Apps Script est déployé en "Application Web"<br>
                        2. L'accès est réglé sur "Tout le monde"<br>
                        3. L'URL dans API_URL est correcte<br>
                        4. Vous avez exécuté la fonction doGet() une fois dans l'éditeur
                    </div>
                `;
                updateStats();
            }
        }
        
        function displayOrders() {
            const container = document.getElementById('ordersContainer');
            
            if (orders.length === 0) {
                container.innerHTML = '<p class="no-orders">🍳 Aucune commande en attente<br><small>Les nouvelles commandes apparaîtront ici</small></p>';
                updateStats();
                return;
            }
            
            container.innerHTML = orders.map(order => {
                const statusLabels = { pending: 'En attente', preparing: 'En préparation', ready: 'Prêt !' };
                const statusBadge = `badge-${order.status}`;
                const orderClass = `order-${order.status}`;
                
                let buttons = '';
                if (order.status === 'pending') {
                    buttons = `<button class="btn btn-start" onclick="changeStatus(${order.id}, 'preparing')">🔪 Commencer</button>`;
                } else if (order.status === 'preparing') {
                    buttons = `<button class="btn btn-ready" onclick="changeStatus(${order.id}, 'ready')">🍽️ Plat prêt</button>`;
                } else if (order.status === 'ready') {
                    buttons = `<button class="btn btn-served" onclick="changeStatus(${order.id}, 'served')">✅ Servi</button>`;
                }
                
                return `
                    <div class="order-card ${orderClass}">
                        <div class="order-header">
                            <h3>Commande #${order.id}</h3>
                            <span class="badge ${statusBadge}">${statusLabels[order.status] || order.status}</span>
                        </div>
                        <p><strong>👤 Client :</strong> ${escapeHtml(order.customer)}</p>
                        <div class="order-items">
                            ${order.items.map(item => `<span class="item-tag">${escapeHtml(item)}</span>`).join('')}
                        </div>
                        <p><strong>💰 Total :</strong> ${typeof order.total === 'number' ? order.total.toFixed(2) : parseFloat(order.total).toFixed(2)} €</p>
                        ${buttons}
                    </div>
                `;
            }).join('');
            
            updateStats();
        }
        
        // Fonction utilitaire pour éviter les injections XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function changeStatus(id, newStatus) {
            if (newStatus === 'served') {
                orders = orders.filter(o => o.id !== id);
            } else {
                const order = orders.find(o => o.id === id);
                if (order) order.status = newStatus;
            }
            displayOrders();
            
            // Optionnel: Envoyer la mise à jour au serveur
            updateOrderStatusOnServer(id, newStatus);
        }
        
        async function updateOrderStatusOnServer(orderId, newStatus) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'updateStatus',
                        orderId: orderId,
                        status: newStatus
                    })
                });
            } catch(error) {
                console.error('Erreur mise à jour status:', error);
            }
        }
        
        function updateStats() {
            document.getElementById('activeCount').textContent = orders.length;
            document.getElementById('preparingCount').textContent = orders.filter(o => o.status === 'preparing').length;
            document.getElementById('readyCount').textContent = orders.filter(o => o.status === 'ready').length;
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleString('fr-FR', { 
                    weekday: 'long', day: 'numeric', month: 'long',
                    hour: '2-digit', minute: '2-digit', second: '2-digit' 
                });
        }
        
        // Rafraîchir toutes les 15 secondes (au lieu de 30)
        setInterval(loadOrders, 15000);
        setInterval(updateTime, 1000);
        
        // Chargement initial
        loadOrders();
        updateTime();
    </script>
</body>
</html>
