<!DOCTYPE html>
<html>
<head><title>Restaurant</title></head>
<body>
<h1>COMMANDES</h1>
<button onclick="charger()">Charger</button>
<div id="liste"></div>

<script>
const API_URL = "https://script.google.com/macros/s/TA_NOUVELLE_URL_ICI/exec";

async function charger() {
    const r = await fetch(API_URL + "?action=getOrders");
    const commandes = await r.json();
    let html = "";
    commandes.forEach(cmd => {
        html += `
            <div style="border:1px solid black; margin:10px; padding:10px">
                <div>${cmd.nom} - ${cmd.plat} - ${cmd.prix} Ar</div>
                <div>ID: ${cmd.id}</div>
                <button onclick="supprimer(${cmd.id})">✅ Supprimer</button>
            </div>
        `;
    });
    document.getElementById('liste').innerHTML = html || "Aucune commande";
}

async function supprimer(id) {
    if(confirm("Supprimer ID " + id + " ?")) {
        const r = await fetch(API_URL + "?action=deleteOrder&id=" + id);
        const reponse = await r.text();
        alert(reponse);
        charger();
    }
}

charger();
</script>
</body>
</html>
