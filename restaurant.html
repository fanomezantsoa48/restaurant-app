<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant - Commandes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>👨‍🍳 COMMANDES EN DIRECT</h1>
        <div id="commandes" class="commandes-list">
            <p>Chargement des commandes...</p>
        </div>
    </div>
    <script>
        // TON URL Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbyEfZx8A7C_b6eRWZWSdkiml5gEhHYRbe5WSfT_YFO1eHa7W4jQnw5ubK35HFKKdGap/exec";
        
        let timers = {};
        
        async function chargerCommandes() {
            try {
                const response = await fetch(API_URL + "?action=getOrders");
                const commandes = await response.json();
                afficherCommandes(commandes);
            } catch(e) {
                console.log("Erreur de chargement:", e);
                document.getElementById('commandes').innerHTML = '<p>🔌 Connexion en cours...</p>';
            }
        }
        
        function afficherCommandes(commandes) {
            const container = document.getElementById('commandes');
            if(!commandes || commandes.length === 0) {
                container.innerHTML = '<p>📭 Aucune commande pour le moment</p>';
                return;
            }
            
            let html = '';
            commandes.forEach((cmd, idx) => {
                // Gérer le temps restant (si pas défini, prendre tempsPrep)
                let tempsRestant = cmd.tempsRestant !== undefined ? cmd.tempsRestant : cmd.tempsPrep;
                let statusClass = 'normal';
                
                if(tempsRestant <= 0) {
                    statusClass = 'urgent';
                } else if(tempsRestant <= 2) {
                    statusClass = 'warning';
                }
                
                // Formater l'affichage du temps
                let chronoText = '';
                if(tempsRestant > 0) {
                    const mins = Math.floor(tempsRestant);
                    const secs = Math.floor((tempsRestant % 1) * 60);
                    chronoText = `⏱️ ${mins}:${secs < 10 ? '0'+secs : secs}`;
                } else {
                    chronoText = '🔴 EN RETARD !';
                }
                
                html += `
                    <div class="commande-card ${statusClass}" data-id="${cmd.id || idx}">
                        <div><strong>🧑 ${cmd.nom}</strong></div>
                        <div>📞 ${cmd.tel || 'Non spécifié'}</div>
                        <div>🍔 ${cmd.plat}</div>
                        <div>💰 ${cmd.prix}€</div>
                        <div>⏰ Réservation: ${cmd.heure || '---'}</div>
                        <div class="chrono" id="chrono-${idx}">${chronoText}</div>
                        <div class="actions">
                            <button onclick="marquerPret(${idx})">✅ Prêt</button>
                            <button onclick="annulerCommande(${idx})">❌ Annuler</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            
            // Démarrer les chronos
            commandes.forEach((cmd, idx) => {
                let tempsRestant = cmd.tempsRestant !== undefined ? cmd.tempsRestant : cmd.tempsPrep;
                if(tempsRestant > 0 && !timers[idx]) {
                    demarrerChrono(idx, tempsRestant, cmd);
                }
            });
        }
        
        function demarrerChrono(idx, duree, commande) {
            let temps = duree;
            timers[idx] = setInterval(() => {
                temps -= 1/60;
                if(temps < 0) temps = 0;
                
                const element = document.getElementById(`chrono-${idx}`);
                if(element) {
                    if(temps <= 0) {
                        clearInterval(timers[idx]);
                        element.textContent = '🔴 EN RETARD !';
                        element.parentElement.classList.add('urgent');
                    } else {
                        const mins = Math.floor(temps);
                        const secs = Math.floor((temps % 1) * 60);
                        element.textContent = `⏱️ ${mins}:${secs < 10 ? '0'+secs : secs}`;
                    }
                }
            }, 1000);
        }
        
        function marquerPret(idx) {
            if(timers[idx]) clearInterval(timers[idx]);
            alert("✅ Commande marquée comme prête !");
            chargerCommandes(); // Rafraîchir
        }
        
        function annulerCommande(idx) {
            if(timers[idx]) clearInterval(timers[idx]);
            alert("❌ Commande annulée");
            chargerCommandes(); // Rafraîchir
        }
        
        // Rafraîchir toutes les 3 secondes
        setInterval(chargerCommandes, 3000);
        chargerCommandes();
    </script>
</body>
</html>
