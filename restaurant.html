<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant - Commandes</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .commande-card {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .commande-card.urgent {
            background: #f8d7da;
            border-left: 5px solid #dc3545;
        }
        .btn-pret {
            background: #28a745;
            color: white;
            padding: 8px 16px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-annuler {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .chrono {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }
        .refresh-btn {
            background: #007bff;
            color: white;
            padding: 8px 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🍳 COMMANDES EN DIRECT</h1>
        <button class="refresh-btn" onclick="chargerCommandes()">🔄 Rafraîchir</button>
        <div id="commandes" class="commandes-list">
            <p>📭 Chargement...</p>
        </div>
    </div>
    <script>
        // TON URL Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbyEfZx8A7C_b6eRWZWSdkiml5gEhHYRbe5WSfT_YFO1eHa7W4jQnw5ubK35HFKKdGap/exec";
        
        let timers = {};
        let commandesActuelles = [];
        
        async function chargerCommandes() {
            const container = document.getElementById('commandes');
            container.innerHTML = '<p>⏳ Chargement...</p>';
            
            try {
                const response = await fetch(API_URL + "?action=getOrders");
                const commandes = await response.json();
                commandesActuelles = commandes;
                
                if(!commandes || commandes.length === 0) {
                    container.innerHTML = '<p>📭 Aucune commande pour le moment</p>';
                    return;
                }
                
                afficherCommandes(commandes);
                demarrerTousLesChronos(commandes);
            } catch(error) {
                console.error("Erreur:", error);
                container.innerHTML = '<p>❌ Erreur de connexion</p>';
            }
        }
        
        function afficherCommandes(commandes) {
            const container = document.getElementById('commandes');
            let html = '';
            
            commandes.forEach((cmd, idx) => {
                const tempsRestant = cmd.tempsRestant !== undefined ? cmd.tempsRestant : (cmd.tempsPrep || 10);
                const estUrgent = tempsRestant <= 0;
                const couleurFond = estUrgent ? "#f8d7da" : "#f8f9fa";
                
                const mins = Math.floor(Math.max(0, tempsRestant));
                const secs = Math.floor((Math.max(0, tempsRestant) % 1) * 60);
                const affichageTemps = tempsRestant <= 0 ? "🔴 EN RETARD !" : `⏱️ ${mins}:${secs < 10 ? '0'+secs : secs}`;
                
                html += `
                    <div class="commande-card ${estUrgent ? 'urgent' : ''}" data-idx="${idx}">
                        <div><strong>🧑 ${cmd.nom}</strong></div>
                        <div>📞 ${cmd.tel || 'Non spécifié'}</div>
                        <div>🍔 ${cmd.plat}</div>
                        <div>💰 ${cmd.prix} Ar</div>
                        <div>⏰ Réservation: ${cmd.heure || '---'}</div>
                        <div class="chrono" id="chrono-${idx}">${affichageTemps}</div>
                        <div style="margin-top:10px;">
                            <button class="btn-pret" onclick="marquerPret(${idx})">✅ Prêt</button>
                            <button class="btn-annuler" onclick="annulerCommande(${idx})">❌ Annuler</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function demarrerTousLesChronos(commandes) {
            // Arrêter tous les chronos existants
            for(let id in timers) {
                clearInterval(timers[id]);
                delete timers[id];
            }
            
            // Démarrer les chronos pour chaque commande
            commandes.forEach((cmd, idx) => {
                let temps = cmd.tempsRestant !== undefined ? cmd.tempsRestant : (cmd.tempsPrep || 10);
                if(temps > 0) {
                    timers[idx] = setInterval(() => {
                        temps -= 1/60;
                        if(temps < 0) temps = 0;
                        
                        // Sauvegarder le temps restant
                        if(commandesActuelles[idx]) {
                            commandesActuelles[idx].tempsRestant = temps;
                        }
                        
                        const element = document.getElementById(`chrono-${idx}`);
                        if(element) {
                            if(temps <= 0) {
                                clearInterval(timers[idx]);
                                element.textContent = '🔴 EN RETARD !';
                                element.parentElement.parentElement.style.background = "#f8d7da";
                            } else {
                                const mins = Math.floor(temps);
                                const secs = Math.floor((temps % 1) * 60);
                                element.textContent = `⏱️ ${mins}:${secs < 10 ? '0'+secs : secs}`;
                            }
                        }
                    }, 1000);
                }
            });
        }
        
        async function marquerPret(rowIndex) {
            if(confirm("✅ Confirmer que cette commande est prête ?")) {
                try {
                    // L'index dans Google Sheets est rowIndex + 2 (car ligne 1 = en-têtes)
                    const sheetRowIndex = rowIndex + 2;
                    await fetch(API_URL + "?action=deleteOrder&rowIndex=" + sheetRowIndex);
                    
                    if(timers[rowIndex]) clearInterval(timers[rowIndex]);
                    chargerCommandes();
                    alert("✅ Commande prête - Supprimée");
                } catch(e) {
                    console.error("Erreur:", e);
                    alert("❌ Erreur lors de la suppression");
                }
            }
        }
        
        async function annulerCommande(rowIndex) {
            if(confirm("❌ Annuler cette commande ?")) {
                try {
                    // L'index dans Google Sheets est rowIndex + 2 (car ligne 1 = en-têtes)
                    const sheetRowIndex = rowIndex + 2;
                    await fetch(API_URL + "?action=deleteOrder&rowIndex=" + sheetRowIndex);
                    
                    if(timers[rowIndex]) clearInterval(timers[rowIndex]);
                    chargerCommandes();
                    alert("❌ Commande annulée - Supprimée");
                } catch(e) {
                    console.error("Erreur:", e);
                    alert("❌ Erreur lors de la suppression");
                }
            }
        }
        
        // Charger au démarrage et toutes les 10 secondes
        chargerCommandes();
        setInterval(chargerCommandes, 10000);
    </script>
</body>
</html>
