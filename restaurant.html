<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respantrie - Administration Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container restaurant-container">
        <header class="restaurant-header">
            <h1>👨‍🍳 Administration Respantrie</h1>
            <p id="currentTime"></p>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <span>Commandes actives</span>
                <strong id="activeOrders">0</strong>
            </div>
            <div class="stat">
                <span>En préparation</span>
                <strong id="preparingOrders">0</strong>
            </div>
            <div class="stat">
                <span>Prêts à servir</span>
                <strong id="readyOrders">0</strong>
            </div>
        </div>

        <div style="margin: 20px 0; display: flex; gap: 10px;">
            <button onclick="loadOrders()" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">
                🔄 Actualiser les commandes
            </button>
            <button onclick="addTestOrder()" style="padding: 10px 20px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer;">
                ➕ Ajouter commande test
            </button>
        </div>

        <div class="orders-container" id="ordersContainer">
            <p class="no-orders">Aucune commande en cours...</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyEfZx8A7C_b6eRWZWSdkiml5gEhHYRbe5WSfT_YFO1eHa7W4jQnw5ubK35HFKKdGap/exec';
        let currentOrders = [
            {
                orderNumber: 1,
                customerName: "Jean Dupont",
                items: [{name: "Poulet rôti"}, {name: "Salade César"}],
                total: 22.00,
                orderTime: new Date(Date.now() - 5 * 60000).toISOString(),
                maxPrepTime: 15,
                status: "preparing",
                preparationStartTime: new Date(Date.now() - 5 * 60000).toISOString()
            },
            {
                orderNumber: 2,
                customerName: "Marie Martin",
                items: [{name: "Saumon grillé"}],
                total: 15.00,
                orderTime: new Date().toISOString(),
                maxPrepTime: 12,
                status: "pending",
                preparationStartTime: null
            }
        ];

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}?action=getOrders`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.orders && data.orders.length > 0) {
                        currentOrders = data.orders;
                    }
                }
            } catch (error) {
                console.log('Mode démo - utilisation des données de test');
            }
            displayOrders();
            updateStats();
        }

        function addTestOrder() {
            const newOrder = {
                orderNumber: currentOrders.length + 1,
                customerName: "Client Test " + (currentOrders.length + 1),
                items: [{name: "Pâtes Bolognaise"}],
                total: 10.00,
                orderTime: new Date().toISOString(),
                maxPrepTime: 10,
                status: "pending",
                preparationStartTime: null
            };
            currentOrders.push(newOrder);
            displayOrders();
            updateStats();
        }

        function displayOrders() {
            const container = document.getElementById('ordersContainer');
            
            if (!currentOrders || currentOrders.length === 0) {
                container.innerHTML = `
                    <p class="no-orders">
                        🍳 Aucune commande en cours...<br>
                        <small>Les nouvelles commandes apparaîtront ici</small>
                    </p>`;
                return;
            }

            container.innerHTML = currentOrders.map(order => {
                const timeRemaining = calculateTimeRemaining(order);
                const statusClass = getStatusClass(order.status);
                const statusText = {
                    'pending': 'En attente',
                    'preparing': 'En préparation',
                    'ready': 'Prêt',
                    'served': 'Servi'
                };
                
                return `
                    <div class="order-card ${statusClass}">
                        <div class="order-header">
                            <h3>Commande #${order.orderNumber}</h3>
                            <span class="order-status-badge">${statusText[order.status] || order.status}</span>
                        </div>
                        
                        <div class="order-details">
                            <p><strong>👤 Client :</strong> ${order.customerName}</p>
                            <div class="order-items">
                                ${order.items.map(item => `
                                    <span class="item-tag">🍽️ ${item.name}</span>
                                `).join('')}
                            </div>
                            <p><strong>💰 Total :</strong> ${order.total.toFixed(2)} €</p>
                            <div class="time-info">
                                <p><strong>⏱️ Temps restant :</strong> ${timeRemaining}</p>
                            </div>
                        </div>

                        <div class="order-actions">
                            ${order.status === 'pending' ? `
                                <button class="action-btn start-btn" onclick="updateOrderStatus(${order.orderNumber}, 'preparing')">
                                    🔪 Commencer la préparation
                                </button>
                            ` : ''}
                            ${order.status === 'preparing' ? `
                                <button class="action-btn ready-btn" onclick="updateOrderStatus(${order.orderNumber}, 'ready')">
                                    🍽️ Plat prêt !
                                </button>
                            ` : ''}
                            ${order.status === 'ready' ? `
                                <button class="action-btn done-btn" onclick="updateOrderStatus(${order.orderNumber}, 'served')">
                                    ✅ Servi au client
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateTimeRemaining(order) {
            if (!order.maxPrepTime) return 'N/A';
            
            const orderTime = new Date(order.orderTime);
            const readyTime = new Date(orderTime.getTime() + order.maxPrepTime * 60000);
            const now = new Date();
            const remaining = readyTime - now;
            
            if (remaining <= 0) return '⌛ Temps écoulé - Vérifier le plat';
            
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            return `${minutes} min ${seconds.toString().padStart(2, '0')} sec`;
        }

        function getStatusClass(status) {
            const classes = {
                'pending': 'status-pending',
                'preparing': 'status-preparing',
                'ready': 'status-ready',
                'served': 'status-served'
            };
            return classes[status] || '';
        }

        async function updateOrderStatus(orderNumber, newStatus) {
            try {
                await fetch(`${API_URL}?action=updateStatus`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ orderNumber, status: newStatus })
                });
            } catch (error) {
                console.log('Mode hors-ligne : mise à jour simulée');
            }
            
            const order = currentOrders.find(o => o.orderNumber === orderNumber);
            if (order) {
                order.status = newStatus;
                if (newStatus === 'preparing') {
                    order.preparationStartTime = new Date().toISOString();
                }
            }
            
            displayOrders();
            updateStats();
        }

        function updateStats() {
            const active = currentOrders.filter(o => o.status !== 'served').length;
            const preparing = currentOrders.filter(o => o.status === 'preparing').length;
            const ready = currentOrders.filter(o => o.status === 'ready').length;
            
            document.getElementById('activeOrders').textContent = active;
            document.getElementById('preparingOrders').textContent = preparing;
            document.getElementById('readyOrders').textContent = ready;
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleString('fr-FR', { 
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long', 
                    day: 'numeric',
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });
            
            // Actualisation des temps restants
            displayOrders();
        }

        // Actualisation toutes les 30 secondes pour Google Sheets
        setInterval(loadOrders, 30000);
        // Actualisation de l'affichage chaque seconde
        setInterval(updateTime, 1000);
        
        // Premier chargement
        loadOrders();
        updateTime();
    </script>
</body>
</html>
