<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant - Commandes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>👨‍🍳 COMMANDES EN DIRECT</h1>
        <button onclick="chargerCommandes()" style="margin-bottom: 15px; padding: 8px 16px;">🔄 Rafraîchir</button>
        <div id="commandes" class="commandes-list">
            <p>📭 Cliquez sur Rafraîchir pour voir les commandes</p>
        </div>
    </div>
    <script>
        // TON URL Google Apps Script - À VÉRIFIER
        const API_URL = "https://script.google.com/macros/s/AKfycbyEfZx8A7C_b6eRWZWSdkiml5gEhHYRbe5WSfT_YFO1eHa7W4jQnw5ubK35HFKKdGap/exec";
        
        let timers = {};
        
        async function chargerCommandes() {
            const container = document.getElementById('commandes');
            container.innerHTML = '<p>⏳ Chargement en cours...</p>';
            
            try {
                console.log("Appel API :", API_URL + "?action=getOrders");
                const response = await fetch(API_URL + "?action=getOrders");
                const data = await response.json();
                console.log("Données reçues :", data);
                
                if(!data || data.length === 0) {
                    container.innerHTML = '<p>📭 Aucune commande pour le moment</p>';
                    return;
                }
                
                afficherCommandes(data);
            } catch(error) {
                console.error("Erreur détaillée:", error);
                container.innerHTML = '<p>❌ Erreur de connexion : ' + error.message + '</p>';
            }
        }
        
        function afficherCommandes(commandes) {
            const container = document.getElementById('commandes');
            let html = '';
            
            commandes.forEach((cmd, idx) => {
                let tempsRestant = cmd.tempsPrep || 10;
                let chronoId = `chrono-${Date.now()}-${idx}`;
                
                html += `
                    <div class="commande-card" style="border:1px solid #ccc; margin:10px; padding:10px; border-radius:10px;">
                        <div><strong>🧑 ${cmd.nom || cmd[0]}</strong></div>
                        <div>📞 ${cmd.tel || cmd[1]}</div>
                        <div>🍔 ${cmd.plat || cmd[2]}</div>
                        <div>💰 ${cmd.prix || cmd[3]}€</div>
                        <div>⏰ ${cmd.heure || cmd[4]}</div>
                        <div class="chrono" id="${chronoId}">⏱️ ${tempsRestant} min</div>
                        <div class="actions" style="margin-top:10px;">
                            <button onclick="alerterPret(${idx})">✅ Prêt</button>
                            <button onclick="alerterAnnuler(${idx})">❌ Annuler</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function alerterPret(idx) {
            alert("✅ Commande marquée comme prête !");
            chargerCommandes();
        }
        
        function alerterAnnuler(idx) {
            alert("❌ Commande annulée");
            chargerCommandes();
        }
        
        // Charger au démarrage
        chargerCommandes();
    </script>
</body>
</html>
