<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant - Commandes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>👨‍🍳 COMMANDES EN TEMPS RÉEL</h1>
        <div id="commandes" class="commandes-list">
            <p>📭 Aucune commande pour le moment</p>
        </div>
    </div>
    <script>
        let timers = {};
        
        function chargerCommandes() {
            let commandes = JSON.parse(localStorage.getItem('commandes') || '[]');
            let container = document.getElementById('commandes');
            
            if(commandes.length === 0) {
                container.innerHTML = '<p>📭 Aucune commande pour le moment</p>';
                return;
            }
            
            let html = '';
            for(let i = 0; i < commandes.length; i++) {
                let cmd = commandes[i];
                let tempsRestant = cmd.tempsRestant;
                let statusClass = 'normal';
                
                if(tempsRestant <= 0) {
                    statusClass = 'urgent';
                } else if(tempsRestant <= 2) {
                    statusClass = 'warning';
                }
                
                let chronoText = '';
                if(tempsRestant > 0) {
                    const mins = Math.floor(tempsRestant);
                    const secs = Math.floor((tempsRestant % 1) * 60);
                    chronoText = `⏱️ ${mins}:${secs < 10 ? '0'+secs : secs}`;
                } else {
                    chronoText = '🔴 EN RETARD !';
                }
                
                html += `
                    <div class="commande-card ${statusClass}" data-id="${cmd.id}">
                        <div><strong>🧑 ${cmd.nom}</strong></div>
                        <div>📞 ${cmd.tel}</div>
                        <div>🍔 ${cmd.plat}</div>
                        <div>💰 ${cmd.prix}€</div>
                        <div>⏰ Réservation: ${cmd.heure}</div>
                        <div class="chrono" id="chrono-${cmd.id}">${chronoText}</div>
                        <div class="actions">
                            <button onclick="marquerPret(${i})">✅ Prêt</button>
                            <button onclick="annulerCommande(${i})">❌ Annuler</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            
            // Démarrer les chronos
            for(let i = 0; i < commandes.length; i++) {
                let cmd = commandes[i];
                if(cmd.status !== 'pret' && cmd.tempsRestant > 0 && !timers[cmd.id]) {
                    demarrerChrono(i, cmd.id, cmd.tempsRestant);
                }
            }
        }
        
        function demarrerChrono(index, id, duree) {
            let temps = duree;
            timers[id] = setInterval(() => {
                temps -= 1/60;
                if(temps < 0) temps = 0;
                
                let commandes = JSON.parse(localStorage.getItem('commandes') || '[]');
                if(commandes[index]) {
                    commandes[index].tempsRestant = temps;
                    localStorage.setItem('commandes', JSON.stringify(commandes));
                }
                
                const element = document.getElementById(`chrono-${id}`);
                if(element) {
                    if(temps <= 0) {
                        clearInterval(timers[id]);
                        element.textContent = '🔴 EN RETARD !';
                        element.parentElement.classList.add('urgent');
                    } else {
                        const mins = Math.floor(temps);
                        const secs = Math.floor((temps % 1) * 60);
                        element.textContent = `⏱️ ${mins}:${secs < 10 ? '0'+secs : secs}`;
                    }
                }
            }, 1000);
        }
        
        function marquerPret(index) {
            let commandes = JSON.parse(localStorage.getItem('commandes') || '[]');
            if(commandes[index]) {
                commandes[index].status = 'pret';
                if(timers[commandes[index].id]) {
                    clearInterval(timers[commandes[index].id]);
                }
                localStorage.setItem('commandes', JSON.stringify(commandes));
                chargerCommandes();
                alert("✅ Commande prête !");
            }
        }
        
        function annulerCommande(index) {
            let commandes = JSON.parse(localStorage.getItem('commandes') || '[]');
            if(commandes[index]) {
                if(timers[commandes[index].id]) {
                    clearInterval(timers[commandes[index].id]);
                }
                commandes.splice(index, 1);
                localStorage.setItem('commandes', JSON.stringify(commandes));
                chargerCommandes();
                alert("❌ Commande annulée");
            }
        }
        
        // Rafraîchir toutes les secondes
        setInterval(chargerCommandes, 1000);
        chargerCommandes();
    </script>
</body>
</html>
