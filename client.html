<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commander</title>
</head>
<body>
    <h1>PASSER COMMANDE</h1>
    <input type="text" id="nom" placeholder="Nom">
    <input type="text" id="plat" placeholder="Plat">
    <input type="number" id="prix" placeholder="Prix">
    <button onclick="commander()">Commander</button>
    <div id="msg"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyEfZx8A7C_b6eRWZWSdkiml5gEhHYRbe5WSfT_YFO1eHa7W4jQnw5ubK35HFKKdGap/exec";
        
        async function commander() {
            const commande = {
                nom: document.getElementById('nom').value,
                plat: document.getElementById('plat').value,
                prix: document.getElementById('prix').value,
                id: Date.now(),  // ← ID unique
                heureDebut: new Date().toISOString(),
                tempsPrep: 10
            };
            
            console.log("Envoi:", commande);
            
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(commande)
            });
            
            document.getElementById('msg').innerHTML = "✅ Commande envoyée ! ID: " + commande.id;
        }
    </script>
</body>
</html>
