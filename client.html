<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respantrie - Commandez votre plat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container client-container">
        <header>
            <h1>🍽️ Respantrie</h1>
            <p class="subtitle">Commandez votre repas en toute simplicité</p>
        </header>

        <section class="menu-section">
            <h2>Notre Menu</h2>
            <div class="menu-grid" id="menuGrid"></div>
        </section>

        <section class="order-section">
            <h2>Votre Commande</h2>
            <div class="cart-summary" id="cartSummary">
                <p class="empty-cart">Sélectionnez vos plats...</p>
            </div>
            
            <div class="customer-info">
                <input type="text" id="customerName" placeholder="Votre nom" required>
                <input type="tel" id="customerPhone" placeholder="Téléphone" required>
            </div>
            
            <button class="order-btn" id="placeOrderBtn" disabled>
                Commander maintenant
            </button>
            
            <div class="order-status" id="orderStatus" style="display: none;">
                <div class="status-card">
                    <span class="checkmark">✅</span>
                    <h3>Commande confirmée !</h3>
                    <p id="estimatedTime">Votre plat sera prêt dans environ <strong id="timeLeft"></strong></p>
                    <p class="order-id">N° de commande : <span id="orderNumber"></span></p>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        // Configuration (à adapter avec tes identifiants Google Sheets)
        const API_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
        let cart = [];
        let menuItems = [];

        // Menu par défaut
        const defaultMenu = [
            {
                id: 1,
                name: "Poulet rôti aux herbes",
                price: 12.50,
                image: "https://images.unsplash.com/photo-1598103442097-8b74394b95c6?w=300",
                prepTime: 15,
                description: "Poulet fermier rôti, thym et romarin"
            },
            {
                id: 2,
                name: "Saumon grillé",
                price: 15.00,
                image: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=300",
                prepTime: 12,
                description: "Filet de saumon, sauce citronnée"
            },
            {
                id: 3,
                name: "Pâtes Bolognaise",
                price: 10.00,
                image: "https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=300",
                prepTime: 10,
                description: "Pâtes fraîches, sauce bolognaise maison"
            },
            {
                id: 4,
                name: "Salade César",
                price: 9.50,
                image: "https://images.unsplash.com/photo-1546793665-c74683f339c1?w=300",
                prepTime: 8,
                description: "Salade romaine, croûtons, parmesan"
            }
        ];

        // Initialisation
        async function initMenu() {
            try {
                const response = await fetch(`${API_URL}?action=getMenu`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.menu && data.menu.length > 0) {
                        menuItems = data.menu;
                    } else {
                        menuItems = defaultMenu;
                    }
                } else {
                    menuItems = defaultMenu;
                }
            } catch (error) {
                console.log('Mode hors-ligne, menu par défaut affiché');
                menuItems = defaultMenu;
            }
            displayMenu();
        }

        function displayMenu() {
            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = menuItems.map(item => `
                <div class="menu-item">
                    <img src="${item.image}" alt="${item.name}" class="menu-image">
                    <div class="menu-info">
                        <h3>${item.name}</h3>
                        <p class="description">${item.description}</p>
                        <p class="prep-time">⏱️ ${item.prepTime} min</p>
                        <p class="price">${item.price.toFixed(2)} €</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${item.id})">
                            Ajouter au panier
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            if (item) {
                cart.push(item);
                updateCartDisplay();
            }
        }

        function updateCartDisplay() {
            const cartSummary = document.getElementById('cartSummary');
            const placeOrderBtn = document.getElementById('placeOrderBtn');
            
            if (cart.length === 0) {
                cartSummary.innerHTML = '<p class="empty-cart">Sélectionnez vos plats...</p>';
                placeOrderBtn.disabled = true;
            } else {
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                const maxPrepTime = Math.max(...cart.map(item => item.prepTime));
                
                cartSummary.innerHTML = `
                    <div class="cart-items">
                        ${cart.map((item, index) => `
                            <div class="cart-item">
                                <span>${item.name}</span>
                                <span>${item.price.toFixed(2)} €</span>
                                <button class="remove-btn" onclick="removeFromCart(${index})">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div class="cart-total">
                        <p>Total : <strong>${total.toFixed(2)} €</strong></p>
                        <p>Temps de préparation estimé : <strong>${maxPrepTime} minutes</strong></p>
                    </div>
                `;
                placeOrderBtn.disabled = false;
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        async function placeOrder() {
            const customerName = document.getElementById('customerName').value;
            const customerPhone = document.getElementById('customerPhone').value;

            if (!customerName || !customerPhone) {
                alert('Veuillez remplir vos informations');
                return;
            }

            const orderData = {
                customerName,
                customerPhone,
                items: cart,
                total: cart.reduce((sum, item) => sum + item.price, 0),
                maxPrepTime: Math.max(...cart.map(item => item.prepTime)),
                orderTime: new Date().toISOString()
            };

            try {
                const response = await fetch(`${API_URL}?action=placeOrder`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const result = await response.json();
                    showOrderConfirmation(result.orderNumber, orderData.maxPrepTime);
                } else {
                    throw new Error('Erreur serveur');
                }
            } catch (error) {
                // Mode hors-ligne : simulation
                const orderNumber = Math.floor(Math.random() * 1000);
                showOrderConfirmation(orderNumber, orderData.maxPrepTime);
            }
        }

        function showOrderConfirmation(orderNumber, prepTime) {
            document.getElementById('orderStatus').style.display = 'block';
            document.getElementById('orderNumber').textContent = orderNumber;
            
            const readyTime = new Date();
            readyTime.setMinutes(readyTime.getMinutes() + prepTime);
            document.getElementById('timeLeft').textContent = 
                `environ ${prepTime} minutes`;
            
            cart = [];
            updateCartDisplay();
        }

        // Event listeners
        document.getElementById('placeOrderBtn').addEventListener('click', placeOrder);
        
        // Initialisation
        initMenu();
    </script>
</body>
</html>
