<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander - FastFood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 Passer commande</h1>
        <form id="orderForm">
            <input type="text" id="nom" placeholder="Votre nom" required>
            <input type="tel" id="tel" placeholder="Téléphone" required>
            <select id="plat" required>
                <option value="">Choisissez un plat</option>
            </select>
            <div>💰 Prix: <span id="prix">0</span> €</div>
            <input type="time" id="heure" required>
            <button type="submit">✅ Commander</button>
        </form>
        <div id="message"></div>
    </div>
    <script>
        // Liste des plats
        const plats = [
            { nom: "Burger", prix: 8, temps: 10 },
            { nom: "Cheeseburger", prix: 9, temps: 12 },
            { nom: "Tacos", prix: 12, temps: 15 },
            { nom: "Frites", prix: 3, temps: 5 },
            { nom: "Nuggets", prix: 5, temps: 8 }
        ];
        
        // Remplir le select
        const select = document.getElementById('plat');
        plats.forEach(plat => {
            const option = document.createElement('option');
            option.value = plat.nom;
            option.textContent = `${plat.nom} - ${plat.prix}€ (${plat.temps}min)`;
            option.dataset.prix = plat.prix;
            option.dataset.temps = plat.temps;
            select.appendChild(option);
        });
        
        // Afficher le prix
        select.addEventListener('change', (e) => {
            const prix = e.target.options[e.target.selectedIndex]?.dataset.prix || 0;
            document.getElementById('prix').textContent = prix;
        });
        
        // Envoyer la commande (sauvegarde dans localStorage)
        document.getElementById('orderForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const platChoisi = plats.find(p => p.nom === document.getElementById('plat').value);
            
            const commande = {
                id: Date.now(), // Identifiant unique
                nom: document.getElementById('nom').value,
                tel: document.getElementById('tel').value,
                plat: document.getElementById('plat').value,
                prix: document.getElementById('prix').textContent,
                heure: document.getElementById('heure').value,
                tempsPrep: platChoisi?.temps || 10,
                tempsRestant: platChoisi?.temps || 10,
                status: "en_attente",
                timestamp: new Date().toLocaleString()
            };
            
            // Récupérer les commandes existantes
            let commandes = JSON.parse(localStorage.getItem('commandes') || '[]');
            commandes.push(commande);
            localStorage.setItem('commandes', JSON.stringify(commandes));
            
            // Afficher le message de succès
            document.getElementById('message').innerHTML = '<p style="color:green">✅ Commande envoyée !</p>';
            document.getElementById('orderForm').reset();
            document.getElementById('prix').textContent = '0';
            
            // Effacer le message après 3 secondes
            setTimeout(() => {
                document.getElementById('message').innerHTML = '';
            }, 3000);
        });
    </script>
</body>
</html>
