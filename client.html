<!DOCTYPE html>
<html>
<head><title>Commander</title></head>
<body>
<h1>COMMANDER</h1>
<input id="nom" placeholder="Nom">
<input id="plat" placeholder="Plat">
<input id="prix" placeholder="Prix">
<button onclick="envoyer()">Envoyer</button>
<div id="msg"></div>

<script>
const API_URL = "https://script.google.com/macros/s/TA_NOUVELLE_URL_ICI/exec";

async function envoyer() {
    const commande = {
        nom: document.getElementById('nom').value,
        plat: document.getElementById('plat').value,
        prix: document.getElementById('prix').value,
        id: Date.now(),
        heureDebut: new Date().toISOString(),
        tempsPrep: 10
    };
    
    console.log("Envoi:", commande);
    await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(commande) });
    document.getElementById('msg').innerHTML = "✅ Envoyé ! ID: " + commande.id;
}
</script>
</body>
</html>
