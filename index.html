<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFood - Commander</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🍔 FASTFOOD</h1>
        <div class="qr-box">
            <h2>Scannez pour commander</h2>
            <div id="qrcode"></div>
        </div>
        <p><a href="client.html">📱 Accès client</a> | <a href="restaurant.html">👨‍🍳 Accès restaurant</a></p>
    </div>
    <script>
        const url = window.location.origin + window.location.pathname.replace("index.html", "client.html");
        new QRCode(document.getElementById("qrcode"), { text: url, width: 200, height: 200 });
    </script>
</body>
</html>
