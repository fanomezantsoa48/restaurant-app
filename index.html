<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respantrie - Commandez vos repas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 20px;
        }
        
        .logo {
            font-size: 5em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        h1 {
            color: white;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.3em;
            margin-bottom: 50px;
        }
        
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .card-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }
        
        .card-client h2 { color: #e67e22; }
        .card-restaurant h2 { color: #2c3e50; }
        
        .card p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        
        .btn-client { background: #e67e22; }
        .btn-restaurant { background: #2c3e50; }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍽️</div>
        <h1>Respantrie</h1>
        <p class="subtitle">La commande de repas simplifiée</p>
        
        <div class="cards">
            <a href="client.html" class="card card-client">
                <div class="card-icon">🛒</div>
                <h2>Je commande</h2>
                <p>Parcourez le menu et passez votre commande en quelques clics</p>
                <span class="btn btn-client">Voir le menu</span>
            </a>
            
            <a href="restaurant.html" class="card card-restaurant">
                <div class="card-icon">👨‍🍳</div>
                <h2>Restaurant</h2>
                <p>Gérez les commandes en temps réel et suivez les préparations</p>
                <span class="btn btn-restaurant">Accéder</span>
            </a>
        </div>
    </div>
</body>
</html>
